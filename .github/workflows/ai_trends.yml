name: AI Trends Weekly Update

on:
  schedule:
    # Run every Sunday at 6 PM UTC (2 PM EST / 1 PM CST)
    - cron: '0 18 * * 0'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  generate-trends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate AI Trends Report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python ai_trends_production.py

      - name: Commit and push report
        run: |
          git config user.name "AI Trends Bot"
          git config user.email "bot@example.com"
          git add ai_trends_report.json
          git commit -m "chore: update AI trends report $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v2.0
        with:
          publish-dir: '.'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: 'AI Trends Update - ${{ github.event.head_commit.timestamp }}'
          enable-pull-request-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
